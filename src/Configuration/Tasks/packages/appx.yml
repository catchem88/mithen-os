---
title: APPX
description: Removal of APPX packages
privilege: TrustedInstaller
actions:
  
  - !writeStatus: {status: "Removing Appx Packages"}
  - !powerShell:
    wait: true
    exeDir: true
    errorAction: Ignore
    weight: 48
    command: >-
       $packages = @(
        'Microsoft.Windows.SecureAssessmentBrowser',
        'Microsoft.Windows.PeopleExperienceHost',
        'MicrosoftWindows.Client.WebExperience',
        'Microsoft.WidgetsPlatformRuntime',
        'Microsoft.WindowsAlarms',
        'Microsoft.WindowsMaps',
        'Microsoft.MicrosoftStickyNotes',
        'microsoft.windowscommunicationsapps',
        'Microsoft.People',
        'Microsoft.BingNews',
        'Microsoft.BingSearch',
        'Microsoft.BingWeather',
        'Microsoft.MicrosoftSolitaireCollection',
        'Microsoft.WindowsFeedbackHub',
        'Microsoft.GetHelp',
        'Microsoft.Getstarted',
        'Microsoft.Todos',
        'Microsoft.PowerAutomateDesktop',
        'Microsoft.549981C3F5F10', # Cortana
        'MicrosoftCorporationII.QuickAssist',
        'MicrosoftCorporationII.MicrosoftFamily',
        'Microsoft.ZuneMusic',
        'Microsoft.ZuneVideo',
        'Clipchamp.Clipchamp',
        'Microsoft.Whiteboard',
        'Microsoft.MicrosoftTeamsforSurfaceHub',
        'MicrosoftCorporationII.MailforSurfaceHub',
        'Microsoft.MicrosoftPowerBIForWindows',
        'Microsoft.SkypeApp',
        'Microsoft.MicrosoftOfficeHub',
        'Microsoft.Office.Excel',
        'Microsoft.Office.PowerPoint',
        'Microsoft.Office.Word',
        'Microsoft.Office.OneNote',
        'Microsoft.OutlookForWindows',
        'SpotifyAB.SpotifyMusic',
        'OutlookPWA',
        'Microsoft.Microsoft3DViewer',
        'Microsoft.Advertising',
        'MixedReality.Portal',
        'Microsoft.MSPaint', # Paint 3D
        'Microsoft.StartExperiencesApp'
        );
        
        & (Join-Path $env:ProgramFiles 'Mithen-Tool\mithentool.exe') appx --all-users --remove ($packages -join ',')

  - !writeStatus: {status: "Removing Photos"}
  - !powerShell:
    option: "remove-appx-photos"
    wait: true
    exeDir: true
    errorAction: Ignore
    weight: 10
    command: >-
      & (Join-Path $env:ProgramFiles 'Mithen-Tool\mithentool.exe') appx --all-users --remove 'Microsoft.Windows.Photos'

  - !writeStatus: {status: "Removing Dev Home", option: "remove-appx-devhome"}
  - !powerShell:
    option: "remove-appx-devhome"
    wait: true
    exeDir: true
    errorAction: Ignore
    weight: 10
    command: >-
      & (Join-Path $env:ProgramFiles 'Mithen-Tool\mithentool.exe') appx --all-users --remove 'Microsoft.Windows.DevHome'

  - !writeStatus: {status: "Removing Your Phone", option: "remove-appx-yourphone"}
  - !powerShell:
    option: "remove-appx-yourphone"
    wait: true
    exeDir: true
    errorAction: Ignore
    weight: 20
    command: >-
      $packages = @(
        'Microsoft.YourPhone',
        'MicrosoftWindows.CrossDevice'
      );
      & (Join-Path $env:ProgramFiles 'Mithen-Tool\mithentool.exe') appx --all-users --remove ($packages -join ',')

  - !writeStatus: {status: "Removing Xbox App"}
  - !powerShell:
    wait: true
    exeDir: true
    errorAction: Ignore
    weight: 10
    command: >-
      $packages = @(
        'Microsoft.GamingApp',
        'Microsoft.XboxApp'
      );
      & (Join-Path $env:ProgramFiles 'Mithen-Tool\mithentool.exe') appx --all-users --remove ($packages -join ',')

  # https://github.com/catchem88/mithen-os/issues/219
  # When the network is available, mithentool installs the latest VCLibs packages; otherwise, it bundles and installs the recent version of VCLibs packages offline (useful during oobe).
  - !writeStatus: {status: "Restoring VCLibs"}
  - !run:
    path: "%ProgramFiles%\\Mithen-Tool"
    exe: "mithentool.exe"
    args: "msstore-apps --id 9NBLGGH3FRZM,9NBLGGH4RV3K -r RP" # 9NBLGGH3FRZM - Desktop; 9NBLGGH4RV3K - UWPDesktop.
    runas: currentUserElevated
    wait: true
    oobe: true
