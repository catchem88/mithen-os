---
title: Packages
description: Removes system (WinSxS) packages
privilege: TrustedInstaller
actions:

  # NOTE: !systemPackage: method of removing system packages is now deprecated and not recommended by Mithen, as it is one of the main cause of #49

  - !writeStatus: {status: "Removing system packages"}
  - !run:
    path: "%ProgramFiles%\\Mithen-Tool"
    exe: "mithentool.exe"
    args: "winpackage --install system-components-removal"
    wait: true
    runas: currentUserElevated
    weight: 100

  - !writeStatus: {status: 'Disabling Windows Defender', option: 'disable-defender'}
  - !run:
    path: "%ProgramFiles%\\Mithen-Tool"
    exe: "mithentool.exe"
    args: "tweaks security defender disable --force"
    wait: true
    runas: currentUserElevated
    weight: 100
    option: 'disable-defender'

  - !writeStatus: {status: 'Enabling Windows Defender', option: 'enable-defender'}
  - !run:
    path: "%ProgramFiles%\\Mithen-Tool"
    exe: "mithentool.exe"
    args: "tweaks security defender enable"
    wait: true
    runas: currentUserElevated
    weight: 100
    option: 'enable-defender'

  - !writeStatus: {status: "Removing AI components", option: 'remove-winsxs-ai'}
  - !run:
    path: "%ProgramFiles%\\Mithen-Tool"
    exe: "mithentool.exe"
    args: "winpackage --install ai-removal"
    wait: true
    runas: currentUserElevated
    weight: 100
    option: 'remove-winsxs-ai'

  - !writeStatus: {status: "Removing OneDrive WinSxS", option: "remove-onedrive"}
  - !run:
    path: "%ProgramFiles%\\Mithen-Tool"
    exe: "mithentool.exe"
    args: "winpackage --install onedrive-removal"
    wait: true
    runas: currentUserElevated
    weight: 100
    option: "remove-onedrive"

  - !registryValue: {path: 'HKCR\ms-gamebar', value: 'URL Protocol', type: REG_SZ, data: '', option: "remove-appx-xbox"}
  - !registryKey: {path: 'HKCR\ms-gamebar\shell\open\command', operation: add, option: "remove-appx-xbox"}
  - !registryValue: {path: 'HKCR\ms-gamebar', value: '', type: REG_SZ, data: '%SystemRoot%\System32\systray.exe', option: "remove-appx-xbox"}
  - !registryValue: {path: 'HKCU\Software\Microsoft\GameBar', value: 'ShowStartupPanel', type: REG_DWORD, data: '0', option: "remove-appx-xbox"}