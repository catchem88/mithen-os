---
title: Optional Features
description: Configures Windows optional features
privilege: TrustedInstaller
actions:
  - !writeStatus: {status: "Configuring features"}
  # ------> 'DISM-FEATURES.ps1' as a bare command is not runnable, it has to be
  # ------> launched with -File like the other scripts
  - !run:
    exeDir: true
    exe: "PowerShell"
    args: '-NoP -ExecutionPolicy Bypass -File DISM-FEATURES.ps1'
    wait: true
    errorAction: Log
    weight: 100