---
title: configure-power-control
description: configure-power-control
privilege: TrustedInstaller
actions:

  # === Disable Hibernate via mithentool
  # ------> Disabling hibernate improves system stability, fixes dual-boot and upgrade issues, and frees up disk space
  # ------> NOTE: It can cause overheating in sleep mode.
  - !run:
    path: "%ProgramFiles%\\MithenTool"
    exe: "mithentool.exe"
    args: "tweaks utilities hibernation disable"
    wait: true
    runas: currentUserElevated
  - !run:
    path: "%ProgramFiles%\\MithenTool"
    exe: "mithentool.exe"
    args: "tweaks utilities fast-startup disable"
    wait: true
    runas: currentUserElevated

  # === Enable Hibernate via mithentool
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\FlyoutMenuSettings', value: 'ShowSleepOption', type: REG_DWORD, data: '1'}

  # === Allow system to be shut down without having to log on - Enabled
  # ------> https://docs.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/shutdown-allow-system-to-be-shut-down-without-having-to-log-on
  # ------> https://www.stigviewer.com/stig/windows_server_2012_member_server/2014-01-07/finding/V-1075
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System', value: 'ShutdownWithoutLogon', type: REG_DWORD, data: '1'}

  # =========================
  # === Usage reporting (battery health and data use) - Disabled
  # =========================
  - !registryValue: {path: 'HKLM\SYSTEM\ControlSet001\Control\Session Manager\Power', value: 'SleepStudyDisabled', type: REG_DWORD, data: '1'}
  - !registryValue: {path: 'HKLM\SYSTEM\ControlSet001\Services\DPS', value: 'Start', type: REG_DWORD, data: '4'}
  - !registryValue: {path: 'HKLM\SYSTEM\ControlSet001\Services\diagsvc', value: 'Start', type: REG_DWORD, data: '4'}
  - !cmd:
    command: 'wevtutil sl Microsoft-Windows-SleepStudy/Diagnostic /q:false & wevtutil sl Microsoft-Windows-Kernel-Processor-Power/Diagnostic /q:false & wevtutil sl Microsoft-Windows-UserModePowerService/Diagnostic /q:false'
    ignoreErrors: true
    weight: 20