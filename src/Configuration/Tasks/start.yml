---
title: Initialization
description: Copies Mithen folders/files, and configures some initial settings
privilege: TrustedInstaller
actions:
  
  - !writeStatus: {status: "Initializing"}

  # Prevent annoying notifications during deployment
  - !registryValue:
    path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Notifications\Settings\Windows.SystemToast.SecurityAndMaintenance'
    value: 'Enabled'
    type: REG_DWORD
    data: '0'

  - !cmd:
    exeDir: true
    command: 'robocopy "Licenses" "%SystemDrive%\Licenses" /E /PURGE /IM /IT /NP'
    ignoreErrors: true
    weight: 30
    
  - !cmd:
    exeDir: true
    command: 'copy /y "hosts" "%WINDIR%\System32\drivers\etc\hosts"'
    weight: 20

  # Necessary to clean DNS Cache after modifying hosts
  - !cmd:
    command: 'ipconfig /flushdns'


  # === Create a restore point for the applied changes
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\SystemRestore', value: 'SystemRestorePointCreationFrequency', type: REG_DWORD, data: '0'}
  - !powerShell:
    exeDir: true
    errorAction: Ignore
    weight: 30
    command: >-
      if (-not (Get-ComputerRestorePoint -ErrorAction SilentlyContinue)) { Enable-ComputerRestore -Drive $env:SystemDrive -ErrorAction SilentlyContinue }
      Checkpoint-Computer -Description 'MithenOS' -RestorePointType MODIFY_SETTINGS
  - !writeStatus: {status: "Installing VCRedist"}
  - !download: 
    url: 'https://aka.ms/vs/17/release/vc_redist.x64.exe'
    destination: "vc_redist.x64.exe"
    overwrite: true
  - !run:
    exeDir: true
    exe: "vc_redist.x64.exe"
    args: '/quiet /norestart'

  - !writeStatus: {status: 'Installing Mithen-Tool'}
  - !download: 
    url: 'https://github.com/catchem88/mithen-tool/releases/latest/download/MithenTool-Setup.exe'
    destination: "MithenTool-Setup-Latest.exe"
    overwrite: true
    errorAction: Log
  - !powerShell:
    exeDir: true
    wait: true
    errorAction: Halt
    weight: 50
    command: >-
      $installer = if (Test-Path -LiteralPath '.\MithenTool-Setup-Latest.exe') {
        '.\MithenTool-Setup-Latest.exe'
      } elseif (Test-Path -LiteralPath '.\MithenTool-Setup.exe') {
        '.\MithenTool-Setup.exe'
      } else {
        throw 'No Mithen-Tool installer was found.'
      };
      Start-Process -FilePath $installer -ArgumentList '/VERYSILENT /TASKS="desktopicon"' -Wait -WindowStyle Hidden

  - !writeStatus: {status: "Optimizing PowerShell"}
  - !run:
    exeDir: true
    exe: "PowerShell"
    args: '-NoP -ExecutionPolicy Bypass -File ngen.ps1'
    weight: 100


