name: Archive and Release

on:
  # Allow manual triggering
  workflow_dispatch:

env:
  FILENAME: 'Mithen-PB-${{ github.event.workflow_run.started_at }}.apbx'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: 'main'

      - name: Set version
        id: set_version
        run: |
          # Get current date in "YY.MM" format
          CURRENT_DATE=$(date +%y.%m)
          echo "VERSION=${CURRENT_DATE}" >> $GITHUB_ENV
        shell: bash

      - name: Update version
        run: |
          $version = "${{ env.VERSION }}"
          $playbookConfPath = "src\playbook.conf"
          $finalizeCMDPath = "src\Executables\FINALIZE.cmd"

          (Get-Content -Path $playbookConfPath) -replace '<Version>.*</Version>', "<Version>$version</Version>" | Set-Content -Path $playbookConfPath

          (Get-Content -Path $finalizeCMDPath) -replace 'set version=.+', "set version=$version" | Set-Content -Path $finalizeCMDPath
        shell: pwsh

      - name: Fetch latest MithenTool-Setup.exe (bundled fallback)
        run: |
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/catchem88/mithen-tool/releases/latest'
          $version = $release.tag_name
          $asset = $release.assets | Where-Object { $_.name -eq 'MithenTool-Setup.exe' } | Select-Object -First 1
          if (-not $asset) { throw 'MithenTool-Setup.exe asset not found in latest mithen-tool release' }

          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile 'src\Executables\MithenTool-Setup.exe' -UseBasicParsing

          if ($asset.digest -like 'sha256:*') {
            $expected = $asset.digest.Substring('sha256:'.Length).ToUpper()
            $actual = (Get-FileHash -Algorithm SHA256 -Path 'src\Executables\MithenTool-Setup.exe').Hash
            if ($actual -ne $expected) { throw "SHA256 mismatch for MithenTool-Setup.exe (expected $expected, got $actual)" }
          }
          echo "MITHEN_TOOL_SHA256=$((Get-FileHash -Algorithm SHA256 -Path 'src\Executables\MithenTool-Setup.exe').Hash)" >> $env:GITHUB_ENV
          echo "MITHEN_TOOL_VERSION=$version" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Archive content
        run: |
          7z a -pmalte -mhe=on "Mithen-PB-${{ env.VERSION }}.apbx" ./src/*

      - name: Generate SHA256
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 -Path "Mithen-PB-${{ env.VERSION }}.apbx").Hash
          echo ("HASH=" + $hash) >> $env:GITHUB_ENV

      - name: Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Uses GitHub token for authentication
          file: "Mithen-PB-${{ env.VERSION }}.apbx"
          asset_name: "Mithen-PB-${{ env.VERSION }}.apbx"
          tag: ${{ env.VERSION }}
          overwrite: true
          release_name: ${{ env.VERSION }}
          prerelease: false # Always set to false
          body: |
            # Download Link ✨

            If you would like to support Mithen, kindly download the Playbook from the provided link below.

            📌Link: 

            SHA256: `${{ env.HASH }}`

            Bundled Mithen-Tool version: [${{ env.MITHEN_TOOL_VERSION }}](https://github.com/catchem88/mithen-tool/releases/tag/${{ env.MITHEN_TOOL_VERSION }}) (SHA256: `${{ env.MITHEN_TOOL_SHA256 }}`)
