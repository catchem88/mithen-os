name: Archive and Release

on:
  # Allow manual triggering
  workflow_dispatch:

env:
  FILENAME: 'MithenOS_Playbook_v${{ github.event.workflow_run.started_at }}.apbx'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: 'main'

      - name: Read version
        id: read_version
        run: |
          $conf = [xml](Get-Content -Path 'src\playbook.conf')
          $version = $conf.Playbook.Version
          echo "VERSION=$version" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Sync version into FINALIZE.cmd
        run: |
          (Get-Content -Path 'src\Executables\FINALIZE.cmd') -replace 'set version=.+', "set version=${{ env.VERSION }}" | Set-Content -Path 'src\Executables\FINALIZE.cmd'
        shell: pwsh

      - name: Fetch latest MithenTool-Setup.exe (bundled fallback)
        run: |
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/catchem88/mithen-tool/releases/latest'
          $version = $release.tag_name
          $asset = $release.assets | Where-Object { $_.name -eq 'MithenTool-Setup.exe' } | Select-Object -First 1
          if (-not $asset) { throw 'MithenTool-Setup.exe asset not found in latest mithen-tool release' }

          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile 'src\Executables\MithenTool-Setup.exe' -UseBasicParsing

          if ($asset.digest -like 'sha256:*') {
            $expected = $asset.digest.Substring('sha256:'.Length).ToUpper()
            $actual = (Get-FileHash -Algorithm SHA256 -Path 'src\Executables\MithenTool-Setup.exe').Hash
            if ($actual -ne $expected) { throw "SHA256 mismatch for MithenTool-Setup.exe (expected $expected, got $actual)" }
          }
          echo "MITHEN_TOOL_SHA256=$((Get-FileHash -Algorithm SHA256 -Path 'src\Executables\MithenTool-Setup.exe').Hash)" >> $env:GITHUB_ENV
          echo "MITHEN_TOOL_VERSION=$version" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Archive content
        run: |
          7z a -pmalte -mhe=on "MithenOS_Playbook_v${{ env.VERSION }}.apbx" ./src/*

      - name: Generate SHA256
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 -Path "MithenOS_Playbook_v${{ env.VERSION }}.apbx").Hash
          echo ("HASH=" + $hash) >> $env:GITHUB_ENV

      - name: Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Uses GitHub token for authentication
          file: "MithenOS_Playbook_v${{ env.VERSION }}.apbx"
          asset_name: "MithenOS_Playbook_v${{ env.VERSION }}.apbx"
          tag: v.${{ env.VERSION }}
          overwrite: true
          release_name: MithenOS Playbook v${{ env.VERSION }}
          prerelease: false # Always set to false
          body: |
            # MithenOS Playbook v${{ env.VERSION }}

            7-Zip replaces the removed MithenZip as the archive handler.

            ## Added

            - **7-Zip (latest x64) is installed** silently during the apply: the newest `7z<version>-x64.exe` from `github.com/ip7z/7zip` releases (7-zip.org URL as fallback), run with `/S`.
            - **Archive formats open in 7-Zip** - `.7z`, `.zip`, `.rar`, `.tar`, `.gz`, `.bz2`, `.xz`, `.zst`, `.lzma`, `.cab`, `.tgz`, `.wim`, `.vhd`, `.vhdx`, `.dmg`, `.esd` and every other type 7-Zip registers are pointed at their `7-Zip.<ext>` ProgId, for the machine and for each loaded user profile. Stale `UserChoice` keys are removed so the handler takes effect; `.iso` stays with Windows.
            - **Windows archive icon** - every `7-Zip.<ext>` ProgId uses `zipfldr.dll`, so archives keep the familiar zipped-folder icon.
            - **7-Zip shell menu** - `HKCU\Software\7-Zip\Options\ContextMenu = 4375`, which is exactly Extract files, Extract Here, Extract to "<folder>", Test archive, Add to archive and Add to "<name>.zip".

            ## MithenTool

            The bundled MithenTool keeps the System Monitor that tracks everything the playbook removes, plus the Windows customizations page that ships the Windhawk mods offline.

            # Download Link ✨

            If you would like to support Mithen, kindly download the Playbook from the provided link below.

            📌Link: 

            SHA256: `${{ env.HASH }}`

            Bundled MithenTool version: [${{ env.MITHEN_TOOL_VERSION }}](https://github.com/catchem88/mithen-tool/releases/tag/${{ env.MITHEN_TOOL_VERSION }}) (SHA256: `${{ env.MITHEN_TOOL_SHA256 }}`)
